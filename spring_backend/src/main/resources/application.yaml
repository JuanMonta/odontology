server:
  port: 8000
  # Compresion gzip en Tomcat: el JSON de listas (pacientes, agenda, reportes)
  # baja ~70-80%. Brotli no viene nativo en Tomcat; gzip es el estandar sin
  # dependencias extra. El cliente (Angular/HttpClient) ya envia Accept-Encoding.
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain,text/css,application/javascript,text/javascript
    min-response-size: 1024
  error:
    # Expone el mensaje de las excepciones (ej. sello de la HC) en el body JSON.
    include-message: always

app:
  jwt:
    # Secreto HS256 para firmar los tokens de sesión del chat. En producción
    # sobreescribir vía variable de entorno JWT_SECRET (mínimo 16 caracteres).
    secret: ${JWT_SECRET:SAS_ODONTOLOGIA_CLINICA_2026_JWT_HS256_SECRETO_LARGO}
  # Directorio raíz de adjuntos del chat (fuera del webroot; nunca servido estático).
  uploads-dir: ${APP_UPLOADS_DIR:uploads}
  backup:
    # Carpeta donde se escriben los .sql del respaldo. OJO: un valor relativo
    # (./backups) se resuelve contra el DIRECTORIO DE TRABAJO del proceso, no
    # contra la raíz del proyecto, así que los dumps acababan en una carpeta u
    # otra según desde dónde se lanzara el backend (raíz del proyecto o
    # spring_backend\). Launch-Servidor-SaaSClinica.ps1 fija BACKUP_DIR a la raíz
    # para que el destino sea siempre el mismo.
    output-dir: ${BACKUP_DIR:./backups}

spring:
  application:
    name: crowie.dev

  jackson:
    deserialization:
      # Permite que campos primitivos ausentes/null (ej. boolean de la HC) se
      # mapeen a su default en lugar de rechazar el payload con 400.
      fail-on-null-for-primitives: false

  session:
    # La identidad es JWT (sin sesión de servidor); spring-session-jdbc queda
    # en el classpath por starters de test y no debe exigir tabla spring_session.
    store-type: none

  datasource:
    # Base de datos canónica: la crea database/schema.sql (ejecutar una vez con
    # `mysql -u root -p < database/schema.sql` desde la raíz del proyecto).
    # characterEncoding=UTF-8: los emojis (utf8mb4) entran y salen intactos.
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:saas_clinica_odontologica}?useUnicode=true&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    backup-username: ${DB_BACKUP_USERNAME}
    backup-password: ${DB_BACKUP_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver
    
  servlet:
    multipart:
      # Adjuntos del chat: tope global coherente con las categorías del servicio.
      max-file-size: 15MB
      max-request-size: 16MB

  jpa:
    # Sin Open Session in View: la sesion Hibernate vive solo dentro del
    # @Transactional del servicio. Es seguro aqui porque el modelo es plano
    # (ninguna asociacion @OneToMany/@ManyToOne/@OneToOne/ManyToMany ni LAZY),
    # todos los controllers son @RestController y devuelven DTOs, y no hay
    # vistas Thymeleaf. Evita retener una conexion del pool mientras se
    # serializa el JSON de la respuesta.
    open-in-view: false
    # El DDL lo posee database/schema.sql (ENUM, JSON, columna generada y
    # semillas). Hibernate NO crea ni altera tablas: 'none'.
    hibernate:
      ddl-auto: none
    # En produccion NO se imprime SQL: cada query a stdout cuesta I/O y ensucia
    # los logs del servidor empaquetado. Para depurar, activar el perfil 'local'
    # (application-local.yaml), que vuelve a poner show-sql y format_sql en true.
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: false

  # Configuración para integración con Ollama local (Spring AI)
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:qwen2.5-coder:7b}
