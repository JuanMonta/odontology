server:
  port: 8000

spring:
  application:
    name: crowie.dev

  datasource:
    # Asegúrate de que 'odontology_db' esté creada en HeidiSQL
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:odontology_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    # 'update' creará o actualizará las tablas automáticamente según nuestras clases Java
    hibernate:
      ddl-auto: update
    # Esto imprimirá las consultas SQL en la consola, vital para debuggear el Nivel Senior
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: true

  # Configuración para integración con Ollama local (Spring AI)
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:qwen2.5-coder:7b}
