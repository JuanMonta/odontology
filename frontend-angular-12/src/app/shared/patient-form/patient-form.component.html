<form class="form" (ngSubmit)="onSubmit()" novalidate>
  <div class="form-grid">
    <label class="field field--full">
      <span class="field-label">NOMBRE COMPLETO *</span>
      <input class="field-input" type="text" [(ngModel)]="name" name="name" placeholder="NOMBRE Y APELLIDO" autocomplete="off" (ngModelChange)="persistDraft()" />
    </label>

    <label class="field">
      <span class="field-label">CÉDULA</span>
      <input class="field-input" type="text" [(ngModel)]="cedula" name="cedula" placeholder="1045678901" maxlength="13" autocomplete="off" (ngModelChange)="persistDraft()" />
    </label>

    <div class="field">
      <span class="field-label">SEXO</span>
      <div class="seg" role="radiogroup" aria-label="Sexo del paciente">
        <button
          class="seg-btn"
          [class.is-active]="sexo === 'F'"
          type="button"
          role="radio"
          [attr.aria-checked]="sexo === 'F'"
          (click)="setSexo('F')"
        >FEMENINO</button>
        <button
          class="seg-btn"
          [class.is-active]="sexo === 'M'"
          type="button"
          role="radio"
          [attr.aria-checked]="sexo === 'M'"
          (click)="setSexo('M')"
        >MASCULINO</button>
      </div>
    </div>

    <label class="field">
      <span class="field-label">FECHA DE NACIMIENTO</span>
      <input class="field-input" type="date" [(ngModel)]="birthDate" name="birthDate" (ngModelChange)="onBirthDateChange()" autocomplete="off" />
    </label>

    <label class="field">
      <span class="field-label">EDAD</span>
      <input class="field-input" type="number" min="0" max="120" [value]="age" name="age" readonly aria-readonly="true" title="Calculada desde la fecha de nacimiento" />
    </label>

    <label class="field">
      <span class="field-label">TELÉFONO</span>
      <input class="field-input" type="tel" [(ngModel)]="phone" name="phone" placeholder="999 000 000" autocomplete="off" (ngModelChange)="persistDraft()" />
    </label>

    <label class="field">
      <span class="field-label">EMAIL</span>
      <input class="field-input" type="email" [(ngModel)]="email" name="email" placeholder="paciente@correo.com" autocomplete="off" (ngModelChange)="persistDraft()" />
    </label>

    <label class="field field--full">
      <span class="field-label">DIRECCIÓN</span>
      <input class="field-input" type="text" [(ngModel)]="address" name="address" placeholder="AV. / JR. Y NÚMERO" autocomplete="off" (ngModelChange)="persistDraft()" />
    </label>

    <label class="field">
      <span class="field-label">ALERGIAS</span>
      <input class="field-input" type="text" [(ngModel)]="allergies" name="allergies" placeholder="NINGUNA" autocomplete="off" (ngModelChange)="persistDraft()" />
    </label>

    <label class="field">
      <span class="field-label">TRATAMIENTO</span>
      <input class="field-input" type="text" [(ngModel)]="treatment" name="treatment" placeholder="LIMPIEZA" autocomplete="off" (ngModelChange)="persistDraft()" />
    </label>

    <div class="field">
      <span class="field-label">ESTADO</span>
      <div class="seg" role="radiogroup" aria-label="Estado del paciente">
        <button
          class="seg-btn"
          [class.is-active]="status === 'active'"
          type="button"
          role="radio"
          [attr.aria-checked]="status === 'active'"
          (click)="setStatus('active')"
        >ACTIVO</button>
        <button
          class="seg-btn"
          [class.is-active]="status === 'inactive'"
          type="button"
          role="radio"
          [attr.aria-checked]="status === 'inactive'"
          (click)="setStatus('inactive')"
        >INACTIVO</button>
      </div>
    </div>
  </div>

  <p class="form-error" *ngIf="error" role="alert">EL NOMBRE DEL PACIENTE ES OBLIGATORIO</p>

  <div class="form-actions">
    <button class="btn-ghost" type="button" (click)="onCancel()">CANCELAR</button>
    <button class="btn-amber" type="submit">GUARDAR PACIENTE</button>
  </div>
</form>
