<form class="form" (ngSubmit)="onSubmit()" novalidate>
  <div class="form-code" *ngIf="treatment">
    <span class="form-code-lbl">CÓDIGO</span>
    <span class="form-code-val">{{ treatment.code }}</span>
  </div>

  <div class="form-grid">
    <ui-field label="NOMBRE DEL TRATAMIENTO" [required]="true" [full]="true">
      <input class="field-input" type="text" [(ngModel)]="name" name="name" placeholder="LIMPIEZA Y PROFILAXIS" autocomplete="off" (ngModelChange)="persistDraft()" />
    </ui-field>

    <ui-field label="CATEGORÍA" [full]="true">
      <select class="field-select" [(ngModel)]="category" name="category" aria-label="Categoría del tratamiento" (ngModelChange)="persistDraft()">
        <option *ngFor="let c of categories" [ngValue]="c">{{ c }}</option>
      </select>
    </ui-field>

    <ui-field label="DURACIÓN (MIN)">
      <input class="field-input" type="number" min="5" max="480" [(ngModel)]="durationMin" name="durationMin" (ngModelChange)="persistDraft()" />
    </ui-field>

    <ui-field label="PRECIO (USD)">
      <input class="field-input" type="number" min="0" [(ngModel)]="price" name="price" (ngModelChange)="persistDraft()" />
    </ui-field>

    <ui-field label="DESCRIPCIÓN" [full]="true">
      <textarea class="field-input field-textarea" rows="3" [(ngModel)]="description" name="description" placeholder="DETALLE CLÍNICO DEL TRATAMIENTO" autocomplete="off" (ngModelChange)="persistDraft()"></textarea>
    </ui-field>

    <ui-field label="ESTADO" [full]="true">
      <div class="seg" role="radiogroup" aria-label="Estado del tratamiento">
        <button
          class="seg-btn"
          [class.is-active]="active"
          type="button"
          role="radio"
          [attr.aria-checked]="active"
          (click)="active = true; persistDraft()"
        >ACTIVO</button>
        <button
          class="seg-btn"
          [class.is-active]="!active"
          type="button"
          role="radio"
          [attr.aria-checked]="!active"
          (click)="active = false; persistDraft()"
        >INACTIVO</button>
      </div>
    </ui-field>
  </div>

  <ui-field label="CONSULTORIOS DISPONIBLES" [full]="true">
    <span fieldSuffix class="equip-count" *ngIf="consultorios.length">{{ consultorios.length }} ASIGNADOS</span>
    <div class="equip-assigned" *ngIf="consultorios.length">
      <ng-container *ngIf="consultorios$ | async as catalog">
        <label class="equip-chip is-on" *ngFor="let c of assignedConsultorios(catalog); trackBy: trackConsultorio">
          <input
            class="equip-input"
            type="checkbox"
            [checked]="true"
            (change)="removeConsultorio(c.code)"
            [attr.aria-label]="'Quitar ' + c.name"
          />
          <span class="equip-lamp" aria-hidden="true"></span>
          <span class="equip-name">{{ c.name }}</span>
        </label>
      </ng-container>
      <button class="equip-add" type="button" (click)="openTrtPicker()">+ AGREGAR</button>
    </div>
    <button
      class="equip-add equip-add--empty"
      type="button"
      *ngIf="!consultorios.length"
      (click)="openTrtPicker()"
    >
      + AGREGAR CONSULTORIOS
    </button>
  </ui-field>

  <p class="form-error" *ngIf="error" role="alert">EL NOMBRE DEL TRATAMIENTO ES OBLIGATORIO</p>

  <div class="form-actions">
    <ui-button type="submit">{{ creating ? 'CREAR TRATAMIENTO' : 'GUARDAR CAMBIOS' }}</ui-button>
    <ui-button variant="ghost" (click)="onCancel()">CANCELAR</ui-button>
  </div>

  <!-- ==================== CATÁLOGO DE CONSULTORIOS (MODAL FLOTANTE) ==================== -->
  <div
    class="picker"
    *ngIf="trtPickerOpen"
    role="dialog"
    aria-modal="true"
    aria-label="Catálogo de consultorios"
  >
    <div class="picker-backdrop" (click)="onTrtPickBackdrop($event)"></div>
    <div
      class="picker-panel"
      #consPickerPanel
      tabindex="-1"
      (click)="$event.stopPropagation()"
    >
      <div class="picker-head">
        <span class="picker-title">CONSULTORIOS DISPONIBLES</span>
        <span class="picker-total" *ngIf="consultorios.length">{{ consultorios.length }} ASIGNADOS</span>
        <button class="picker-close" type="button" aria-label="Cerrar catálogo" (click)="closeTrtPicker()">
          <svg class="icon-x" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true">
            <path d="M3 3l10 10"></path>
            <path d="M13 3L3 13"></path>
          </svg>
        </button>
      </div>

      <div class="picker-search">
        <svg class="picker-search-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true">
          <circle cx="7" cy="7" r="4.5"></circle>
          <path d="M10.5 10.5L14 14"></path>
        </svg>
        <input
          class="picker-search-input"
          type="text"
          [ngModel]="trtPickQuery"
          (ngModelChange)="trtPickQuery = $event; onTrtPickQuery()"
          name="trtPickQuery"
          placeholder="BUSCAR CONSULTORIO…"
          autocomplete="off"
        />
      </div>

      <ng-container *ngIf="consultorios$ | async as consultorios">
        <div class="picker-body">
          <label
            class="equip-chip"
            *ngFor="let item of visibleConsultorios(consultorios); trackBy: trackConsultorio"
            [class.is-on]="consSelected(item.code)"
            [class.is-disabled]="item.status === 'mantenimiento'"
          >
            <input
              class="equip-input"
              type="checkbox"
              [checked]="consSelected(item.code)"
              [disabled]="item.status === 'mantenimiento'"
              (change)="consPickToggle(item)"
              [attr.aria-label]="item.name"
            />
            <span class="equip-lamp" aria-hidden="true"></span>
            <span class="equip-main">
              <span class="equip-name">{{ item.name }}</span>
              <span class="equip-sub">{{ item.code }}</span>
            </span>
            <span class="equip-flag" *ngIf="item.status === 'mantenimiento'">MANTENIMIENTO</span>
          </label>
          <p class="picker-empty" *ngIf="!visibleConsultorios(consultorios).length" role="status">SIN RESULTADOS PARA LA BÚSQUEDA</p>
        </div>
      </ng-container>

      <div class="picker-foot">
        <ui-button (click)="closeTrtPicker()">CONFIRMAR</ui-button>
        <ui-button variant="ghost" (click)="closeTrtPicker()">CANCELAR</ui-button>
      </div>
    </div>
  </div>
</form>
