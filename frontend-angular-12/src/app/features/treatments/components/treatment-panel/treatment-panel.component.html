<!-- Creando / editando tratamiento -->
<ng-container *ngIf="creating || editing">
  <ui-panel
    [kicker]="creating ? 'NUEVO TRATAMIENTO' : 'EDITAR TRATAMIENTO'"
    [title]="creating ? 'REGISTRO DE TRATAMIENTO' : (editingTreatment?.code ?? treatment?.code ?? '')"
    (close)="closeForm()"
  >
    <app-treatment-form
      [treatment]="creating ? null : editingTreatment"
      [creating]="creating"
      (saved)="onSaved($event)"
      (cancel)="creating ? cancel.emit() : cancelEdit()"
    ></app-treatment-form>
  </ui-panel>
</ng-container>

<!-- Sin selección -->
<ng-container *ngIf="!creating && !editing && !treatment">
  <ui-empty variant="panel" text="SELECCIONA UN TRATAMIENTO" hint="ABRE UNA FILA DEL CATÁLOGO PARA VER SU FICHA"></ui-empty>
</ng-container>

<!-- Tratamiento seleccionado -->
<ng-container *ngIf="!creating && !editing && treatment">
  <ui-panel
    [kicker]="treatment.active ? 'ACTIVO' : 'INACTIVO'"
    [title]="treatment.name"
    [warn]="!treatment.active"
    (close)="close.emit()"
  >
    <div panelMeta class="panel-meta">
      <div class="meta-row">
        <span class="meta-label">CÓDIGO</span>
        <span class="meta-value">{{ treatment.code }}</span>
      </div>
      <div class="meta-row">
        <span class="meta-label">CATEGORÍA</span>
        <span class="meta-value">{{ treatment.category }}</span>
      </div>
      <div class="meta-row">
        <span class="meta-label">DURACIÓN</span>
        <span class="meta-value">{{ treatment.durationMin }} MIN</span>
      </div>
      <div class="meta-row">
        <span class="meta-label">PRECIO</span>
        <span class="meta-value">{{ money(treatment.price) }}</span>
      </div>
    </div>

    <div class="section">
      <span class="section-label">DESCRIPCIÓN</span>
      <p class="desc-text" *ngIf="treatment.description; else noDesc">{{ treatment.description }}</p>
      <ng-template #noDesc>
        <ui-empty text="SIN DESCRIPCIÓN REGISTRADA"></ui-empty>
      </ng-template>
    </div>

    <div class="section">
      <span class="section-label">CONSULTORIOS DISPONIBLES</span>
      <ng-container *ngIf="consultorios$ | async as catalog">
        <div class="cons-wrap" *ngIf="consultoriosDeLaFicha(catalog).length; else noCons">
          <ui-chip
            *ngFor="let c of consultoriosDeLaFicha(catalog); trackBy: consTrack"
            [name]="c.name"
            [sub]="c.code"
          ></ui-chip>
        </div>
        <ng-template #noCons>
          <ui-empty text="NO DISPONIBLE EN NINGÚN CONSULTORIO"></ui-empty>
        </ng-template>
      </ng-container>
    </div>

    <div class="section">
      <span class="section-label">ACTIVIDAD</span>
      <div class="stats">
        <ui-stat [value]="treatment.usage" label="EN PACIENTES"></ui-stat>
        <ui-stat [value]="treatment.active ? 'ACTIVO' : 'INACTIVO'" label="ESTADO"></ui-stat>
      </div>
    </div>

    <div panelActions class="panel-actions">
      <ui-button (click)="startEdit()">EDITAR TRATAMIENTO</ui-button>
      <ui-button variant="ghost" (click)="toggle.emit(treatment!.id)">
        {{ treatment.active ? 'INACTIVAR' : 'REACTIVAR' }}
      </ui-button>
    </div>
  </ui-panel>
</ng-container>
