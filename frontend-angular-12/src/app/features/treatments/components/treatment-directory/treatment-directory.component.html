<div class="dir">
  <div class="dir-head">
    <span class="col col-code">CÓDIGO</span>
    <span class="col col-name">TRATAMIENTO</span>
    <span class="col col-cat">CATEGORÍA</span>
    <span class="col col-dur">DURACIÓN</span>
    <span class="col col-price">PRECIO</span>
    <span class="col col-status">ESTADO</span>
  </div>

  <div class="dir-list" *ngIf="treatments.length; else empty">
    <button
      *ngFor="let t of treatments"
      class="dir-row"
      [class.is-selected]="t.id === selectedId"
      type="button"
      (click)="select.emit(t)"
    >
      <span class="col col-code">{{ t.code }}</span>
      <span class="col col-name">{{ t.name }}</span>
      <span class="col col-cat">{{ t.category }}</span>
      <span class="col col-dur">{{ t.durationMin }} MIN</span>
      <span class="col col-price">{{ money(t.price) }}</span>
      <span class="col col-status">
        <span class="lamp" [class.lamp--on]="t.active" aria-hidden="true"></span>
        <span class="status-text">{{ t.active ? 'ACTIVO' : 'INACTIVO' }}</span>
      </span>
    </button>
  </div>

  <ng-template #empty>
    <div class="dir-empty">
      <span class="dir-empty-lamp" aria-hidden="true"></span>
      <p>SIN RESULTADOS</p>
      <p class="dir-empty-hint">AJUSTA LA BÚSQUEDA O EL FILTRO</p>
    </div>
  </ng-template>
</div>
