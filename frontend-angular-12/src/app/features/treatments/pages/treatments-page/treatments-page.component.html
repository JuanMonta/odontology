<div class="page treatments">
  <header class="page-head">
    <div class="page-head-row">
      <div class="page-head-left">
        <h2 class="page-title">CATÁLOGO DE TRATAMIENTOS</h2>
        <span class="page-sub">OPERACIÓN · TARIFARIO · {{ (treatments$ | async)?.length ?? 0 }} ITEMS</span>
      </div>
      <div class="page-head-actions">
        <ui-button size="lg" (click)="startCreate()">
          <span class="btn-plus" aria-hidden="true"></span>
          NUEVO TRATAMIENTO
        </ui-button>
      </div>
    </div>
    <div class="page-toolbar">
      <label class="search">
        <span class="search-icon" aria-hidden="true"></span>
        <input
          class="search-input"
          type="search"
          placeholder="BUSCAR TRATAMIENTO · NOMBRE / CÓDIGO / CATEGORÍA"
          aria-label="Buscar tratamiento"
          (input)="onSearch($any($event.target).value)"
        />
      </label>
      <div class="filter">
        <span class="filter-label">CATEGORÍA</span>
        <select
          class="filter-select"
          aria-label="Filtrar por categoría"
          (change)="onCategory($any($event.target).value)"
        >
          <option value="all">TODAS</option>
          <option *ngFor="let c of categories" [value]="c">{{ c }}</option>
        </select>
      </div>
    </div>
  </header>

  <div class="page-body">
    <section class="directory" aria-label="Catálogo de tratamientos">
      <app-treatment-directory
        [treatments]="(treatments$ | async) ?? []"
        [selectedId]="selectedId"
        (select)="onSelect($event)"
      ></app-treatment-directory>
    </section>

    <aside class="detail" aria-label="Ficha de tratamiento">
      <app-treatment-panel
        [treatment]="(selected$ | async) ?? null"
        [creating]="creating"
        (close)="onClosePanel()"
        (cancel)="cancelCreate()"
        (saved)="onSaved($event)"
        (toggle)="onToggleActive($event)"
      ></app-treatment-panel>
    </aside>
  </div>
</div>
