<div class="dir">
  <div class="dir-head">
    <span class="col col-code">CÓDIGO</span>
    <span class="col col-name">TURNO</span>
    <span class="col col-jornada">JORNADA</span>
    <span class="col col-descanso">DESCANSO</span>
    <span class="col col-status">ESTADO</span>
  </div>

  <div class="dir-list" *ngIf="turnos.length; else empty">
    <button
      *ngFor="let t of visibleTurnos"
      class="dir-row"
      [class.is-selected]="t.id === selectedId"
      [class.is-inactive]="!t.activo"
      type="button"
      (click)="select.emit(t)"
    >
      <span class="col col-code">{{ t.code }}</span>
      <span class="col col-name">
        {{ t.nombre }}
        <span class="col-name-license">TURNO LABORAL</span>
      </span>
      <span class="col col-jornada">{{ jornada(t) }}</span>
      <span class="col col-descanso">{{ descanso(t) }}</span>
      <span class="col col-status">
        <ui-lamp [tone]="t.activo ? 'on' : 'off'"></ui-lamp>
        <span class="status-text" [class.status-text--away]="!t.activo">{{ t.activo ? 'activo' : 'inactivo' }}</span>
      </span>
    </button>
  </div>

  <ng-template #empty>
    <ui-empty variant="bare" text="SIN TURNOS" hint="AJUSTA LA BÚSQUEDA O EL FILTRO"></ui-empty>
  </ng-template>

  <app-pagination
    *ngIf="turnos.length > pageSize"
    [total]="turnos.length"
    [page]="page"
    [pageSize]="pageSize"
    (pageChange)="goToPage($event)"
    (pageSizeChange)="setPageSize($event)"
  ></app-pagination>
</div>
