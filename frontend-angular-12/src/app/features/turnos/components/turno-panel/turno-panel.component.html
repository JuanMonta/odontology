<!-- Creando / editando turno -->
<ui-panel
  *ngIf="creating || editing"
  [kicker]="creating ? 'NUEVO TURNO' : 'EDITAR TURNO'"
  [title]="creating ? 'REGISTRO DE TURNO LABORAL' : (turno?.code ?? '')"
  (close)="closeForm()"
>
  <app-turno-form
    [turno]="editing ? turno : null"
    (saved)="onSaved($event)"
    (cancel)="creating ? cancel.emit() : cancelEdit()"
  ></app-turno-form>
</ui-panel>

<!-- Sin selección -->
<ui-empty
  *ngIf="!creating && !editing && !turno"
  variant="panel"
  text="SELECCIONA UN TURNO"
  hint="ABRE UNA FILA DEL CATÁLOGO PARA VER SU JORNADA"
></ui-empty>

<!-- Turno seleccionado -->
<ui-panel
  *ngIf="!creating && !editing && turno"
  [kicker]="turno.activo ? 'TURNO ACTIVO' : 'TURNO INACTIVO'"
  [title]="turno.nombre"
  [warn]="!turno.activo"
  (close)="close.emit()"
>
  <div panelMeta class="panel-meta">
    <div class="meta-row">
      <span class="meta-label">CÓDIGO</span>
      <span class="meta-value">{{ turno.code }}</span>
    </div>
    <div class="meta-row">
      <span class="meta-label">JORNADA LABORAL</span>
      <span class="meta-value">{{ jornada() }}</span>
    </div>
    <div class="meta-row">
      <span class="meta-label">DESCANSO</span>
      <span class="meta-value">{{ descanso() }}</span>
    </div>
  </div>

  <div class="section">
    <span class="section-label">REGLA DE JORNADA</span>
    <div class="stats">
      <ui-stat [value]="turno.activo ? 'HABILITADO' : 'DESHABILITADO'" label="DISPONIBLE PARA EL ROSTER"></ui-stat>
    </div>
  </div>

  <div panelActions class="panel-actions">
    <ui-button (click)="startEdit()">EDITAR TURNO</ui-button>
    <ui-button variant="ghost" (click)="toggle.emit(turno!.id)">
      {{ turno.activo ? 'DESHABILITAR' : 'HABILITAR' }}
    </ui-button>
  </div>
</ui-panel>
