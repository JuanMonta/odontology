<form class="form" (ngSubmit)="onSubmit()" novalidate>
  <div class="form-grid">
    <label class="field">
      <span class="field-label">NOMBRE DEL TURNO *</span>
      <input
        class="field-input"
        type="text"
        [(ngModel)]="nombre"
        name="nombre"
        placeholder="MAÑANA"
        autocomplete="off"
      />
    </label>

    <label class="field">
      <span class="field-label">HORA DE INICIO *</span>
      <input class="field-input" type="time" [(ngModel)]="horaInicio" name="horaInicio" aria-label="Hora de inicio" />
    </label>

    <label class="field">
      <span class="field-label">HORA DE FIN *</span>
      <input class="field-input" type="time" [(ngModel)]="horaFin" name="horaFin" aria-label="Hora de fin" />
    </label>

    <label class="field">
      <span class="field-label">INICIO DE DESCANSO</span>
      <input class="field-input" type="time" [(ngModel)]="descansoInicio" name="descansoInicio" aria-label="Inicio de descanso" />
    </label>

    <label class="field">
      <span class="field-label">FIN DE DESCANSO</span>
      <input class="field-input" type="time" [(ngModel)]="descansoFin" name="descansoFin" aria-label="Fin de descanso" />
    </label>
  </div>

  <p class="form-hint">EL DESCANSO ES OPCIONAL: DEFINE LA PAUSA DE ALMUERZO DENTRO DE LA JORNADA.</p>

  <p class="form-error" *ngIf="error" role="alert">{{ errorMsg }}</p>

  <div class="form-actions">
    <button class="btn-ghost" type="button" (click)="cancel.emit()">CANCELAR</button>
    <button class="btn-amber" type="submit">GUARDAR TURNO</button>
  </div>
</form>
