<form class="form" (ngSubmit)="onSubmit()" novalidate>
  <div class="form-grid">
    <ui-field label="NOMBRE DEL TURNO" [required]="true">
      <input
        class="field-input"
        type="text"
        [(ngModel)]="nombre"
        name="nombre"
        placeholder="MAÑANA"
        autocomplete="off"
      />
    </ui-field>

    <ui-field label="HORA DE INICIO" [required]="true">
      <input class="field-input" type="time" [(ngModel)]="horaInicio" name="horaInicio" aria-label="Hora de inicio" />
    </ui-field>

    <ui-field label="HORA DE FIN" [required]="true">
      <input class="field-input" type="time" [(ngModel)]="horaFin" name="horaFin" aria-label="Hora de fin" />
    </ui-field>

    <ui-field label="INICIO DE DESCANSO">
      <input class="field-input" type="time" [(ngModel)]="descansoInicio" name="descansoInicio" aria-label="Inicio de descanso" />
    </ui-field>

    <ui-field label="FIN DE DESCANSO">
      <input class="field-input" type="time" [(ngModel)]="descansoFin" name="descansoFin" aria-label="Fin de descanso" />
    </ui-field>
  </div>

  <p class="form-hint">EL DESCANSO ES OPCIONAL: DEFINE LA PAUSA DE ALMUERZO DENTRO DE LA JORNADA.</p>

  <p class="form-error" *ngIf="error" role="alert">{{ errorMsg }}</p>

  <div class="form-actions">
    <ui-button variant="ghost" (click)="cancel.emit()">CANCELAR</ui-button>
    <ui-button type="submit">GUARDAR TURNO</ui-button>
  </div>
</form>
