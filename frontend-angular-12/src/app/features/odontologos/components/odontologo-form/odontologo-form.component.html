<form class="form" (ngSubmit)="onSubmit()" novalidate>
  <div class="form-grid">
    <ui-field label="NOMBRE" [required]="true">
      <input
        class="field-input"
        type="text"
        [(ngModel)]="name"
        name="name"
        placeholder="DR. RIVERA"
        autocomplete="off"
      />
    </ui-field>

    <ui-field label="LICENCIA COP" [required]="true">
      <input
        class="field-input"
        type="text"
        [(ngModel)]="license"
        name="license"
        placeholder="COP 12453"
        autocomplete="off"
      />
    </ui-field>

    <ui-field label="ESPECIALIDAD">
      <select class="field-select" [(ngModel)]="specialty" name="specialty" aria-label="Especialidad">
        <option *ngFor="let s of especialidadOptions$ | async" [ngValue]="s">{{ s }}</option>
      </select>
    </ui-field>

    <ui-field label="CONSULTORIO">
      <select class="field-select" [(ngModel)]="consultorio" name="consultorio" aria-label="Consultorio">
        <option *ngFor="let c of consultorioOptions$ | async" [ngValue]="c">{{ c }}</option>
      </select>
    </ui-field>

    <ui-field label="TURNO">
      <select class="field-select" [(ngModel)]="turno" name="turno" aria-label="Turno">
        <option *ngFor="let t of turnoOptions$ | async" [ngValue]="t">{{ t }}</option>
      </select>
    </ui-field>

    <ui-field label="ESTADO">
      <select class="field-select" [(ngModel)]="status" name="status" aria-label="Estado del odontólogo">
        <option *ngFor="let s of statuses" [ngValue]="s">{{ s }}</option>
      </select>
    </ui-field>
  </div>

  <p class="form-error" *ngIf="error" role="alert">NOMBRE Y LICENCIA SON OBLIGATORIOS</p>

  <div class="form-actions">
    <ui-button type="submit">{{ odontologo ? 'GUARDAR CAMBIOS' : 'REGISTRAR PROFESIONAL' }}</ui-button>
    <ui-button variant="ghost" (click)="cancel.emit()">CANCELAR</ui-button>
  </div>
</form>
