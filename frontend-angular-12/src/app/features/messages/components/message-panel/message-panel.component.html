<!-- Creando mensaje -->
<ui-panel
  *ngIf="creating"
  kicker="NUEVO MENSAJE"
  title="REDACTAR COMUNICACIÓN"
  (close)="cancel.emit()"
>
  <app-message-form (saved)="saved.emit($event)" (cancel)="cancel.emit()"></app-message-form>
</ui-panel>

<!-- Sin selección -->
<ui-empty
  *ngIf="!creating && !message"
  variant="panel"
  text="SELECCIONA UN MENSAJE"
  hint="ABRE UNA FILA DEL TABLERO PARA LEERLO"
></ui-empty>

<!-- Mensaje seleccionado -->
<ui-panel
  *ngIf="!creating && message"
  [kicker]="prioridadKicker(message.prioridad)"
  [title]="message.subject"
  [warn]="message.prioridad === 'urgente'"
  (close)="close.emit()"
>
  <div panelMeta class="panel-meta">
    <div class="meta-row">
      <span class="meta-label">PARA</span>
      <span class="meta-value">{{ destinoLabel(message.destino) }}</span>
    </div>
    <div class="meta-row">
      <span class="meta-label">REMITENTE</span>
      <span class="meta-value">{{ message.from }}</span>
    </div>
    <div class="meta-row">
      <span class="meta-label">FECHA</span>
      <span class="meta-value">{{ message.date }} · {{ message.time }}</span>
    </div>
  </div>

  <p class="msg-body">{{ message.body }}</p>

  <div panelActions class="panel-actions">
    <ui-button (click)="toggleRead()">
      {{ message.status === 'unread' ? 'MARCAR LEÍDO' : 'MARCAR NO LEÍDO' }}
    </ui-button>
  </div>
</ui-panel>
