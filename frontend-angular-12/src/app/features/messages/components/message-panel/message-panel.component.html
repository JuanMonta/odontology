<div class="panel">
  <!-- Creando mensaje -->
  <ng-container *ngIf="creating">
    <div class="panel-head">
      <div class="panel-head-info">
        <span class="panel-kicker">NUEVO MENSAJE</span>
        <span class="panel-title">REDACTAR COMUNICACIÓN</span>
      </div>
      <button class="icon-btn" type="button" aria-label="Cerrar" (click)="cancel.emit()">
        <svg class="icon-x" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true">
          <path d="M3 3l10 10"></path>
          <path d="M13 3L3 13"></path>
        </svg>
      </button>
    </div>
    <div class="panel-scroll">
      <app-message-form (submit)="saved.emit($event)" (cancel)="cancel.emit()"></app-message-form>
    </div>
  </ng-container>

  <!-- Sin selección -->
  <ng-container *ngIf="!creating && !message">
    <div class="panel-empty">
      <span class="panel-empty-mark" aria-hidden="true"><span class="panel-empty-cell">+</span></span>
      <span class="panel-empty-title">SELECCIONA UN MENSAJE</span>
      <span class="panel-empty-hint">ABRE UNA FILA DEL TABLERO PARA LEERLO</span>
    </div>
  </ng-container>

  <!-- Mensaje seleccionado -->
  <ng-container *ngIf="!creating && message">
    <div class="panel-head">
      <div class="panel-head-info">
        <span class="panel-kicker" [class.panel-kicker--urgent]="message.urgent">
          {{ message.urgent ? 'MENSAJE URGENTE' : 'COMUNICACIÓN DEL CONSULTORIO' }}
        </span>
        <span class="panel-title">{{ message.subject }}</span>
      </div>
      <button class="icon-btn" type="button" aria-label="Cerrar" (click)="close.emit()">
        <svg class="icon-x" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true">
          <path d="M3 3l10 10"></path>
          <path d="M13 3L3 13"></path>
        </svg>
      </button>
    </div>

    <div class="panel-meta">
      <div class="meta-row">
        <span class="meta-label">REMITENTE</span>
        <span class="meta-value">{{ message.from }}</span>
      </div>
      <div class="meta-row">
        <span class="meta-label">FECHA</span>
        <span class="meta-value">{{ message.date }} · {{ message.time }}</span>
      </div>
    </div>

    <div class="panel-scroll">
      <p class="msg-body">{{ message.body }}</p>
    </div>

    <div class="panel-actions">
      <button class="btn-amber" type="button" (click)="toggleRead()">
        {{ message.status === 'unread' ? 'MARCAR LEÍDO' : 'MARCAR NO LEÍDO' }}
      </button>
    </div>
  </ng-container>
</div>
