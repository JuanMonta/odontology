<div class="dir">
  <div class="dir-head">
    <span class="col col-flag">ESTADO</span>
    <span class="col col-subject">ASUNTO</span>
    <span class="col col-para">PARA</span>
    <span class="col col-date">FECHA</span>
    <span class="col col-time">HORA</span>
  </div>

  <div class="dir-list" *ngIf="messages.length; else empty">
    <button
      *ngFor="let m of visibleMessages"
      class="dir-row"
      [class.is-selected]="m.id === selectedId"
      [class.is-unread]="m.status === 'unread'"
      type="button"
      (click)="select.emit(m)"
    >
      <span class="col col-flag">
        <span
          class="lamp"
          [class.lamp--urgente]="m.prioridad === 'urgente'"
          [class.lamp--importante]="m.prioridad === 'importante'"
          [class.lamp--informacion]="m.prioridad === 'informacion'"
          [class.lamp--live]="m.status === 'unread'"
          aria-hidden="true"
        ></span>
      </span>
      <span class="col col-subject">
        <span class="prio-chip" [class.prio--urgente]="m.prioridad === 'urgente'" [class.prio--importante]="m.prioridad === 'importante'">
          {{ prioridadLabel(m.prioridad) }}
        </span>
        <span class="subject-text">{{ m.subject }}</span>
      </span>
      <span class="col col-para">{{ destinoLabel(m.destino) }}</span>
      <span class="col col-date">{{ m.date }}</span>
      <span class="col col-time">{{ m.time }}</span>
    </button>
  </div>

  <ng-template #empty>
    <ui-empty variant="bare" text="SIN MENSAJES" hint="AJUSTA LA BÚSQUEDA O EL FILTRO"></ui-empty>
  </ng-template>

  <app-pagination
    *ngIf="messages.length > pageSize"
    [total]="messages.length"
    [page]="page"
    [pageSize]="pageSize"
    (pageChange)="goToPage($event)"
    (pageSizeChange)="setPageSize($event)"
  ></app-pagination>
</div>
