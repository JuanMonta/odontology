<form class="form" (ngSubmit)="onSubmit()" novalidate>
  <div class="form-grid">
    <label class="field field--full">
      <span class="field-label">PARA</span>
      <select class="field-select" [(ngModel)]="destino" name="destino" aria-label="Público objetivo del mensaje">
        <option *ngFor="let d of destinos$ | async" [ngValue]="d.id">{{ d.label }}</option>
      </select>
    </label>

    <label class="field">
      <span class="field-label">PRIORIDAD</span>
      <select class="field-select" [(ngModel)]="prioridad" name="prioridad" aria-label="Prioridad del mensaje">
        <option *ngFor="let p of priorities" [ngValue]="p.id">{{ p.label }}</option>
      </select>
    </label>

    <label class="field">
      <span class="field-label">REMITENTE</span>
      <input class="field-input" type="text" [value]="sender" readonly aria-label="Remitente del mensaje" />
    </label>

    <label class="field field--full">
      <span class="field-label">ASUNTO *</span>
      <input
        class="field-input"
        type="text"
        [(ngModel)]="subject"
        name="subject"
        placeholder="REPROGRAMACIÓN · PAGO · CONSULTA CLÍNICA"
        autocomplete="off"
      />
    </label>

    <label class="field field--full">
      <span class="field-label">MENSAJE</span>
      <textarea
        class="field-input field-textarea"
        rows="6"
        [(ngModel)]="body"
        name="body"
        placeholder="DETALLE DE LA COMUNICACIÓN INTERNA DEL CONSULTORIO"
        autocomplete="off"
      ></textarea>
    </label>
  </div>

  <p class="form-error" *ngIf="error" role="alert">ASUNTO ES OBLIGATORIO</p>

  <div class="form-actions">
    <button class="btn-amber" type="submit">ENVIAR MENSAJE</button>
    <button class="btn-ghost" type="button" (click)="cancel.emit()">CANCELAR</button>
  </div>
</form>
