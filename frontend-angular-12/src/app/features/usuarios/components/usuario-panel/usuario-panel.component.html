<!-- Creando / editando cuenta -->
<ui-panel
  *ngIf="creating || editing"
  [kicker]="creating ? 'NUEVO USUARIO' : 'EDITAR CUENTA'"
  [title]="creating ? 'REGISTRO DE CUENTA' : (usuario?.code ?? '')"
  (close)="closeForm()"
>
  <app-usuario-form
    [usuario]="editing ? usuario : null"
    [roles]="roles"
    [estados]="estados"
    [esAdmin]="esAdmin"
    (saved)="onSaved($event)"
    (cancel)="creating ? cancel.emit() : cancelEdit()"
    (crearRol)="crearRol.emit($event)"
    (crearEstado)="crearEstado.emit($event)"
  ></app-usuario-form>
</ui-panel>

<!-- Sin selección -->
<ui-empty
  *ngIf="!creating && !editing && !usuario"
  variant="panel"
  text="SELECCIONA UNA CUENTA"
  hint="ABRE UNA FILA DEL CONTROL PARA VER SU FICHA"
></ui-empty>

<!-- Cuenta seleccionada -->
<ui-panel
  *ngIf="!creating && !editing && usuario"
  [kicker]="statusLabel(usuario.status)"
  [title]="usuario.name"
  [warn]="usuario.status !== 'activo'"
  (close)="close.emit()"
>
  <div panelMeta class="panel-meta">
    <div class="meta-row">
      <span class="meta-label">CÓDIGO</span>
      <span class="meta-value">{{ usuario.code }}</span>
    </div>
    <div class="meta-row">
      <span class="meta-label">USUARIO</span>
      <span class="meta-value">@{{ usuario.username }}</span>
    </div>
    <div class="meta-row">
      <span class="meta-label">ROL</span>
      <span class="meta-value">{{ usuario.role }}</span>
    </div>
    <div class="meta-row">
      <span class="meta-label">TELÉFONO</span>
      <span class="meta-value">{{ usuario.phone }}</span>
    </div>
  </div>

  <div class="section">
    <span class="section-label">ACCESO</span>
    <div class="stats">
      <ui-stat [value]="usuario.status === 'activo' ? 'EN LÍNEA' : 'SIN ACCESO'" label="ESTADO ACTUAL"></ui-stat>
      <ui-stat [value]="usuario.lastAccess" label="ÚLTIMO ACCESO"></ui-stat>
    </div>
  </div>

  <div panelActions class="panel-actions">
    <ui-button (click)="startEdit()">EDITAR CUENTA</ui-button>
    <ui-button variant="ghost" (click)="toggle.emit(usuario!.id)">
      {{ usuario.status === 'activo' ? 'SUSPENDER' : 'REACTIVAR' }}
    </ui-button>
  </div>
</ui-panel>
