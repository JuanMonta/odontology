<div class="dir">
  <div class="dir-head">
    <span class="col col-code">CÓDIGO</span>
    <span class="col col-user">USUARIO</span>
    <span class="col col-name">NOMBRE</span>
    <span class="col col-role">ROL</span>
    <span class="col col-status">ESTADO</span>
  </div>

  <div class="dir-list" *ngIf="usuarios.length; else empty">
    <button
      *ngFor="let u of visibleUsuarios"
      class="dir-row"
      [class.is-selected]="u.id === selectedId"
      [class.is-inactive]="u.status === 'inactivo'"
      [class.is-suspended]="u.status === 'suspendido'"
      type="button"
      (click)="select.emit(u)"
    >
      <span class="col col-code">{{ u.code }}</span>
      <span class="col col-user">{{ u.username }}</span>
      <span class="col col-name">{{ u.name }}</span>
      <span class="col col-role">{{ u.role }}</span>
      <span class="col col-status">
        <ui-lamp [tone]="u.status === 'activo' ? 'on' : (u.status === 'suspendido' ? 'warn' : 'off')"></ui-lamp>
        <span class="status-text" [class.status-text--warn]="u.status === 'suspendido'">{{ u.status }}</span>
      </span>
    </button>
  </div>

  <ng-template #empty>
    <ui-empty variant="bare" text="SIN USUARIOS" hint="AJUSTA LA BÚSQUEDA O EL FILTRO"></ui-empty>
  </ng-template>

  <app-pagination
    *ngIf="usuarios.length > pageSize"
    [total]="usuarios.length"
    [page]="page"
    [pageSize]="pageSize"
    (pageChange)="goToPage($event)"
    (pageSizeChange)="setPageSize($event)"
  ></app-pagination>
</div>
