<!--
  DIRECCIÓN: PANEL DE CONTROL DE ACCESO — concourse split-flap aplicado al
  control de acceso del consultorio. THESIS: los usuarios se leen como el
  registro del personal clínico; cada cuenta es una credencial con rol y estado
  en vivo (activo / suspendido / inactivo), y solo la lámpara de quien puede
  operar el sistema enciende ámbar. OWN-WORLD: matte black flaps, letras
  pintadas, acero cepillado, lámparas ámbar para lo que está en servicio.
  STORY: el administrador escanea las cuentas, detecta suspensiones al instante
  y abre la ficha de cada usuario. FIRST VIEWPORT: tablero de cuentas + panel de
  detalle. FORM: split-flap concourse board (challenger), mismo shell de
  ODONTÓLOGOS/TRATAMIENTOS.
-->
<div class="page usuarios">
  <header class="page-head">
    <div class="page-head-row">
      <div class="page-head-left">
        <h2 class="page-title">CONTROL DE USUARIOS</h2>
        <span class="page-sub">CUENTAS Y ROLES · ACCESO AL SISTEMA · {{ (usuarios$ | async)?.length ?? 0 }} USUARIOS</span>
      </div>
      <div class="page-head-actions">
        <button class="btn-amber" type="button" (click)="startCreate()">
          <span class="btn-plus" aria-hidden="true"></span>
          NUEVO USUARIO
        </button>
      </div>
    </div>
    <div class="page-toolbar">
      <label class="search">
        <span class="search-icon" aria-hidden="true"></span>
        <input
          class="search-input"
          type="search"
          placeholder="BUSCAR CUENTA · USUARIO / NOMBRE / ROL"
          aria-label="Buscar usuario"
          (input)="onSearch($any($event.target).value)"
        />
      </label>
      <div class="filter">
        <span class="filter-label">ESTADO</span>
        <select
          class="filter-select"
          aria-label="Filtrar por estado"
          (change)="onFilter($any($event.target).value)"
        >
          <option value="all">TODOS</option>
          <option *ngFor="let e of estados$ | async" [value]="e.nombre">{{ e.nombre | uppercase }}</option>
        </select>
      </div>
    </div>
  </header>

  <div class="page-body">
    <section class="directory" aria-label="Control de usuarios">
      <app-usuario-directory
        [usuarios]="(usuarios$ | async) ?? []"
        [selectedId]="selectedId"
        (select)="onSelect($event)"
      ></app-usuario-directory>
    </section>

    <aside class="detail" aria-label="Ficha de usuario">
      <app-usuario-panel
        [usuario]="(selected$ | async) ?? null"
        [creating]="creating"
        [roles]="(roles$ | async) ?? []"
        [estados]="(estados$ | async) ?? []"
        [esAdmin]="(esAdmin$ | async) ?? false"
        (close)="onClosePanel()"
        (cancel)="cancelCreate()"
        (saved)="onSaved($event)"
        (toggle)="onToggleStatus($event)"
        (crearRol)="onCrearRol($event)"
        (crearEstado)="onCrearEstado($event)"
      ></app-usuario-panel>
    </aside>
  </div>
</div>
