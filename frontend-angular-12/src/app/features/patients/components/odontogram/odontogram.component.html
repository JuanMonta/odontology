<div class="odonto">
  <svg
    class="odonto-svg"
    viewBox="0 0 470 176"
    role="img"
    aria-label="Odontograma, 32 piezas dentales"
  >
    <g
      *ngFor="let tv of top"
      [class]="'tooth ' + stateClass(tv.tooth.status)"
      role="button"
      tabindex="0"
      [attr.aria-label]="ariaLabel(tv)"
      (click)="cycle(tv)"
      (keydown.enter)="cycle(tv)"
    >
      <rect [attr.x]="tv.x" [attr.y]="tv.y" width="26" height="34" rx="3"></rect>
      <path *ngIf="tv.tooth.status !== 'missing'" class="crown" [attr.d]="crownD(tv)"></path>
      <line *ngIf="tv.tooth.status === 'missing'" class="slash" [attr.x1]="tv.x + 6" [attr.y1]="tv.y + 6" [attr.x2]="tv.x + 20" [attr.y2]="tv.y + 28"></line>
      <line *ngIf="tv.tooth.status === 'missing'" class="slash" [attr.x1]="tv.x + 20" [attr.y1]="tv.y + 6" [attr.x2]="tv.x + 6" [attr.y2]="tv.y + 28"></line>
      <text [attr.x]="tv.cx" [attr.y]="tv.y + 24" class="num">{{ tv.tooth.number }}</text>
    </g>

    <g
      *ngFor="let tv of bottom"
      [class]="'tooth ' + stateClass(tv.tooth.status)"
      role="button"
      tabindex="0"
      [attr.aria-label]="ariaLabel(tv)"
      (click)="cycle(tv)"
      (keydown.enter)="cycle(tv)"
    >
      <rect [attr.x]="tv.x" [attr.y]="tv.y" width="26" height="34" rx="3"></rect>
      <path *ngIf="tv.tooth.status !== 'missing'" class="crown" [attr.d]="crownD(tv)"></path>
      <line *ngIf="tv.tooth.status === 'missing'" class="slash" [attr.x1]="tv.x + 6" [attr.y1]="tv.y + 6" [attr.x2]="tv.x + 20" [attr.y2]="tv.y + 28"></line>
      <line *ngIf="tv.tooth.status === 'missing'" class="slash" [attr.x1]="tv.x + 20" [attr.y1]="tv.y + 6" [attr.x2]="tv.x + 6" [attr.y2]="tv.y + 28"></line>
      <text [attr.x]="tv.cx" [attr.y]="tv.y + 24" class="num">{{ tv.tooth.number }}</text>
    </g>
  </svg>

  <div class="odonto-legend" aria-hidden="true">
    <div *ngFor="let c of counts()" class="legend-item">
      <span class="swatch" [class]="'swatch--' + c.status"></span>
      <span class="legend-label">{{ statusLabel(c.status) }}</span>
      <span class="legend-count">{{ c.count }}</span>
    </div>
  </div>

  <p class="odonto-hint">CLIC EN UNA PIEZA PARA CAMBIAR SU ESTADO</p>
</div>
