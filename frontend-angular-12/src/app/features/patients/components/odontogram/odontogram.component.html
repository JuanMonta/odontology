<div class="odonto">
  <div class="odonto-sprite" [innerHTML]="spriteHtml" aria-hidden="true"></div>
  <svg
    class="odonto-svg"
    viewBox="0 0 1000 480"
    role="img"
    aria-label="Odontograma Formulario 033: 32 piezas permanentes y 20 deciduas"
  >
        

        <!-- ==================== SUPERIOR ==================== -->
        <!-- RECESIÓN superior -->
        <text
          x="10"
          y="18"
          class="odo-label"
        >RECESIÓN</text>
        <g
          *ngFor="let tv of topPerm"
          role="button"
          tabindex="0"
          [class.perio--off]="isMissing(tv)"
          [attr.aria-label]="'Recesión pieza ' + tv.number"
          (click)="clickPerio(tv, 'recesion')"
          (keydown.enter)="clickPerio(tv, 'recesion')"
        >
          <rect
            [attr.x]="tv.x"
            [attr.y]="perioBoxY('recesion', 'top')"
            width="35"
            height="18"
            class="perio-box"
          ></rect>
          <text
            [attr.x]="tv.x + 17.5"
            [attr.y]="perioBoxY('recesion', 'top') + 13"
            class="perio-val"
          >{{ perioValue(tv, 'recesion') }}</text>
        </g>

        <!-- MOVILIDAD superior -->
        <text
          x="10"
          y="52"
          class="odo-label"
        >MOVILIDAD</text>
        <g
          *ngFor="let tv of topPerm"
          role="button"
          tabindex="0"
          [class.perio--off]="isMissing(tv)"
          [attr.aria-label]="'Movilidad pieza ' + tv.number"
          (click)="clickPerio(tv, 'movilidad')"
          (keydown.enter)="clickPerio(tv, 'movilidad')"
        >
          <rect
            [attr.x]="tv.x"
            [attr.y]="perioBoxY('movilidad', 'top')"
            width="35"
            height="18"
            class="perio-box"
          ></rect>
          <text
            [attr.x]="tv.x + 17.5"
            [attr.y]="perioBoxY('movilidad', 'top') + 13"
            class="perio-val"
          >{{ perioValue(tv, 'movilidad') }}</text>
        </g>

        <!-- VESTIBULAR superior (números) -->
        <text
          x="10"
          y="120"
          class="odo-label"
        >VESTIBULAR</text>
        <text
          *ngFor="let tv of topPerm"
          [attr.x]="numX(tv)"
          [attr.y]="90"
          class="num"
        >{{ tv.number }}</text>

        <!-- VESTIBULAR superior (dientes) -->
        <ng-container *ngFor="let tv of topPerm">
          <ng-container *ngTemplateOutlet="tooth; context: { $implicit: tv }"></ng-container>
        </ng-container>

        <!-- ==================== LINGUAL ==================== -->
        <text
          x="10"
          y="215"
          class="odo-label"
        >LINGUAL</text>
        <text
          *ngFor="let tv of topDec"
          [attr.x]="numX(tv)"
          [attr.y]="175"
          class="num"
        >{{ tv.number }}</text>
        <ng-container *ngFor="let tv of topDec">
          <ng-container *ngTemplateOutlet="tooth; context: { $implicit: tv }"></ng-container>
        </ng-container>

        <text
          *ngFor="let tv of botDec"
          [attr.x]="numX(tv)"
          [attr.y]="295"
          class="num"
        >{{ tv.number }}</text>
        <ng-container *ngFor="let tv of botDec">
          <ng-container *ngTemplateOutlet="tooth; context: { $implicit: tv }"></ng-container>
        </ng-container>

        <!-- ==================== INFERIOR ==================== -->
        <text
          x="10"
          y="350"
          class="odo-label"
        >VESTIBULAR</text>
        <ng-container *ngFor="let tv of botPerm">
          <ng-container *ngTemplateOutlet="tooth; context: { $implicit: tv }"></ng-container>
        </ng-container>
        <text
          *ngFor="let tv of botPerm"
          [attr.x]="numX(tv)"
          [attr.y]="385"
          class="num"
        >{{ tv.number }}</text>

        <!-- MOVILIDAD inferior -->
        <text
          x="10"
          y="418"
          class="odo-label"
        >MOVILIDAD</text>
        <g
          *ngFor="let tv of botPerm"
          role="button"
          tabindex="0"
          [class.perio--off]="isMissing(tv)"
          [attr.aria-label]="'Movilidad pieza ' + tv.number"
          (click)="clickPerio(tv, 'movilidad')"
          (keydown.enter)="clickPerio(tv, 'movilidad')"
        >
          <rect
            [attr.x]="tv.x"
            [attr.y]="perioBoxY('movilidad', 'bottom')"
            width="35"
            height="18"
            class="perio-box"
          ></rect>
          <text
            [attr.x]="tv.x + 17.5"
            [attr.y]="perioBoxY('movilidad', 'bottom') + 13"
            class="perio-val"
          >{{ perioValue(tv, 'movilidad') }}</text>
        </g>

        <!-- RECESIÓN inferior -->
        <text
          x="10"
          y="452"
          class="odo-label"
        >RECESIÓN</text>
        <g
          *ngFor="let tv of botPerm"
          role="button"
          tabindex="0"
          [class.perio--off]="isMissing(tv)"
          [attr.aria-label]="'Recesión pieza ' + tv.number"
          (click)="clickPerio(tv, 'recesion')"
          (keydown.enter)="clickPerio(tv, 'recesion')"
        >
          <rect
            [attr.x]="tv.x"
            [attr.y]="perioBoxY('recesion', 'bottom')"
            width="35"
            height="18"
            class="perio-box"
          ></rect>
          <text
            [attr.x]="tv.x + 17.5"
            [attr.y]="perioBoxY('recesion', 'bottom') + 13"
            class="perio-val"
          >{{ perioValue(tv, 'recesion') }}</text>
        </g>

        <!-- Prótesis (arcadas) -->
        <g
          *ngFor="let s of topSpans"
          class="span"
          [style.color]="s.color"
        >
          <path
            *ngIf="s.d"
            [attr.d]="s.d"
            class="span-line"
            [class.span-line--solid]="s.c === 'protesis-total'"
          ></path>
          <path
            *ngIf="s.ends"
            [attr.d]="s.ends"
            class="span-ends"
          ></path>
        </g>
        <g
          *ngFor="let s of botSpans"
          class="span"
          [style.color]="s.color"
        >
          <path
            *ngIf="s.d"
            [attr.d]="s.d"
            class="span-line"
            [class.span-line--solid]="s.c === 'protesis-total'"
          ></path>
          <path
            *ngIf="s.ends"
            [attr.d]="s.ends"
            class="span-ends"
          ></path>
        </g>

        <!-- Plantilla de pieza -->
        <ng-template
          #tooth
          let-tv
        >
          <g
            class="tooth"
            [class.tooth--missing]="isMissing(tv)"
            role="button"
            tabindex="0"
            [attr.aria-label]="ariaLabel(tv)"
            (click)="clickTooth(tv)"
            (keydown.enter)="clickTooth(tv)"
          >
            <ng-container *ngIf="tv.kind === 'perm'">
              <rect
                [attr.x]="tv.x"
                [attr.y]="tv.y"
                width="35"
                height="35"
                class="tooth-body"
              ></rect>
              <rect
                [attr.x]="tv.x + 7"
                [attr.y]="tv.y + 7"
                width="21"
                height="21"
                class="tooth-inner"
              ></rect>
              <line
                [attr.x1]="tv.x"
                [attr.y1]="tv.y"
                [attr.x2]="tv.x + 7"
                [attr.y2]="tv.y + 7"
                class="tooth-inner-line"
              ></line>
              <line
                [attr.x1]="tv.x + 35"
                [attr.y1]="tv.y"
                [attr.x2]="tv.x + 28"
                [attr.y2]="tv.y + 7"
                class="tooth-inner-line"
              ></line>
              <line
                [attr.x1]="tv.x"
                [attr.y1]="tv.y + 35"
                [attr.x2]="tv.x + 7"
                [attr.y2]="tv.y + 28"
                class="tooth-inner-line"
              ></line>
              <line
                [attr.x1]="tv.x + 35"
                [attr.y1]="tv.y + 35"
                [attr.x2]="tv.x + 28"
                [attr.y2]="tv.y + 28"
                class="tooth-inner-line"
              ></line>
            </ng-container>
            <ng-container *ngIf="tv.kind === 'dec'">
              <circle
                [attr.cx]="tv.x"
                [attr.cy]="tv.y"
                r="22"
                class="tooth-body"
              ></circle>
              <circle
                [attr.cx]="tv.x"
                [attr.cy]="tv.y"
                r="10"
                class="tooth-inner"
              ></circle>
              <line
                [attr.x1]="tv.x - 15.56"
                [attr.y1]="tv.y - 15.56"
                [attr.x2]="tv.x - 7.07"
                [attr.y2]="tv.y - 7.07"
                class="tooth-inner-line"
              ></line>
              <line
                [attr.x1]="tv.x + 15.56"
                [attr.y1]="tv.y - 15.56"
                [attr.x2]="tv.x + 7.07"
                [attr.y2]="tv.y - 7.07"
                class="tooth-inner-line"
              ></line>
              <line
                [attr.x1]="tv.x - 15.56"
                [attr.y1]="tv.y + 15.56"
                [attr.x2]="tv.x - 7.07"
                [attr.y2]="tv.y + 7.07"
                class="tooth-inner-line"
              ></line>
              <line
                [attr.x1]="tv.x + 15.56"
                [attr.y1]="tv.y + 15.56"
                [attr.x2]="tv.x + 7.07"
                [attr.y2]="tv.y + 7.07"
                class="tooth-inner-line"
              ></line>
            </ng-container>

            <!-- Caries / obturado por cara -->
            <ng-container *ngFor="let o of faceOverlays(tv)">
              <rect
                *ngIf="o.kind === 'rect'"
                [attr.x]="o.x"
                [attr.y]="o.y"
                [attr.width]="o.w"
                [attr.height]="o.h"
                [attr.fill]="o.color"
                class="face-paint"
              ></rect>
              <path
                *ngIf="o.kind === 'path'"
                [attr.d]="o.d"
                [attr.fill]="o.color"
                class="face-paint"
              ></path>
              <circle
                *ngIf="o.kind === 'circle'"
                [attr.cx]="o.cx"
                [attr.cy]="o.cy"
                [attr.r]="o.r"
                [attr.fill]="o.color"
                class="face-paint"
              ></circle>
            </ng-container>

            <!-- Corona -->
            <rect
              *ngIf="coronaRect(tv) as cr"
              [attr.x]="cr.x"
              [attr.y]="cr.y"
              [attr.width]="cr.w"
              [attr.height]="cr.h"
              class="corona-mark"
              [style.color]="colorOf('corona')"
            ></rect>

            <!-- Símbolos de diente completo -->
                        <g *ngFor="let m of wholeMarks(tv)" class="symbol">
              <use [attr.href]="'#s-' + m.id" [attr.x]="m.x" [attr.y]="m.y" [attr.width]="m.size" [attr.height]="m.size"></use>
            </g>
          </g>
        </ng-template>
      </svg>

  <div
    class="odo-faces"
    *ngIf="isFaceTool()"
    role="group"
    aria-label="Cara del diente a marcar"
  >
    <span class="odo-faces-label">{{ activeTool === 'caries' ? 'CARIES' : 'OBTURADO' }} EN:</span>
    <button
      *ngFor="let f of faces"
      class="odo-face"
      [class.is-on]="faceMarked(f)"
      type="button"
      [attr.aria-pressed]="faceMarked(f)"
      [style.--face-c]="faceMarkColor(f) || colorOf(activeTool)"
      (click)="facePick(f)"
    >
      {{ faceLabel(f) }}
    </button>
    <span
      *ngIf="!faceTarget"
      class="odo-faces-hint"
    >CLIC EN UNA PIEZA PARA ELEGIR SU CARA</span>
  </div>

  <div
    class="odo-tools"
    role="group"
    aria-label="Símbolos clínicos"
  >
    <button
      *ngFor="let c of order"
      class="odo-tool"
      [class.is-active]="isActive(c)"
      type="button"
      [attr.aria-pressed]="isActive(c)"
      (click)="selectTool(c)"
    >
            <svg class="odo-tool-ico" viewBox="0 0 24 24" aria-hidden="true">
        <use [attr.href]="'#s-' + c" width="24" height="24"></use>
      </svg>
      <span class="odo-tool-label">{{ symbolLabel(c) }}</span>
      <span class="odo-tool-count">{{ countFor(c) }}</span>
    </button>

    <button
      class="odo-tool odo-tool--clear"
      [class.is-active]="isActive('clear')"
      type="button"
      [attr.aria-pressed]="isActive('clear')"
      (click)="selectTool('clear')"
    >
      <svg
        class="odo-tool-ico"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <path d="M6 6 L18 18 M18 6 L6 18"></path>
      </svg>
      <span class="odo-tool-label">SANO</span>
      <span class="odo-tool-count odo-tool-count--dim">—</span>
    </button>
  </div>

  <p class="odonto-hint">ROJO = PATOLOGÍA / NECESIDAD · AZUL = TRATAMIENTO REALIZADO</p>
</div>
