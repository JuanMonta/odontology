<form class="form" (ngSubmit)="onSubmit()" novalidate>
  <div class="form-grid">
    <ui-field label="NOMBRE DE LA ESPECIALIDAD" [required]="true">
      <input
        class="field-input"
        type="text"
        [(ngModel)]="nombre"
        name="nombre"
        placeholder="CIRUGÍA ORAL"
        autocomplete="off"
      />
    </ui-field>
  </div>

  <p class="form-hint">EL NOMBRE SE ALMACENA EN MAYÚSCULAS EN EL CATÁLOGO CLÍNICO.</p>

  <p class="form-error" *ngIf="error" role="alert">{{ errorMsg }}</p>

  <div class="form-actions">
    <ui-button variant="ghost" (click)="cancel.emit()">CANCELAR</ui-button>
    <ui-button type="submit">GUARDAR ESPECIALIDAD</ui-button>
  </div>
</form>
