<!-- Creando / editando especialidad -->
<ui-panel
  *ngIf="creating || editing"
  [kicker]="creating ? 'NUEVA ESPECIALIDAD' : 'EDITAR ESPECIALIDAD'"
  [title]="creating ? 'ALTA DE ESPECIALIDAD CLÍNICA' : (especialidad?.code ?? '')"
  (close)="closeForm()"
>
  <app-especialidad-form
    [especialidad]="editing ? especialidad : null"
    (saved)="onSaved($event)"
    (cancel)="creating ? cancel.emit() : cancelEdit()"
  ></app-especialidad-form>
</ui-panel>

<!-- Sin selección -->
<ui-empty
  *ngIf="!creating && !editing && !especialidad"
  variant="panel"
  text="SELECCIONA UNA ESPECIALIDAD"
  hint="ABRE UNA FILA DEL CATÁLOGO PARA VER SU FICHA"
></ui-empty>

<!-- Especialidad seleccionada -->
<ui-panel
  *ngIf="!creating && !editing && especialidad"
  [kicker]="especialidad.activo ? 'ESPECIALIDAD ACTIVA' : 'ESPECIALIDAD INACTIVA'"
  [title]="especialidad.nombre"
  [warn]="!especialidad.activo"
  (close)="close.emit()"
>
  <div panelMeta class="panel-meta">
    <div class="meta-row">
      <span class="meta-label">CÓDIGO</span>
      <span class="meta-value">{{ especialidad.code }}</span>
    </div>
    <div class="meta-row">
      <span class="meta-label">ESPECIALIDAD</span>
      <span class="meta-value">{{ especialidad.nombre }}</span>
    </div>
  </div>

  <div class="section">
    <span class="section-label">USO EN EL ROSTER</span>
    <div class="stats">
      <ui-stat [value]="especialidad.activo ? 'HABILITADA' : 'DESHABILITADA'" label="DISPONIBLE PARA ASIGNAR A PROFESIONALES"></ui-stat>
    </div>
  </div>

  <div panelActions class="panel-actions">
    <ui-button (click)="startEdit()">EDITAR ESPECIALIDAD</ui-button>
    <ui-button variant="ghost" (click)="toggle.emit(especialidad!.id)">
      {{ especialidad.activo ? 'DESHABILITAR' : 'HABILITAR' }}
    </ui-button>
  </div>
</ui-panel>
