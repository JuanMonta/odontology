<!--
  DIRECCIÓN: SPLIT-FLAP CONCOURSE aplicado al acceso de la clínica. THESIS: entrar
  a la app es acreditarse en recepción; el login es un letrero de tablero donde el
  personal valida su acceso. OWN-WORLD: matte black flaps, letras pintadas, acero
  cepillado y lámparas ámbar; la lámpara verde de la nota demo indica "servidor en
  línea". STORY: el usuario llega a recepción, presenta sus credenciales e INGRESA
  hacia el tablero principal. FIRST VIEWPORT: caja centrada de acceso con brand,
  título flap y formulario. FORM: split-flap concourse board (challenger).
-->
<div class="stage">
  <div class="board">
    <header class="board-head">
      <span class="brand-mark" aria-hidden="true"><span class="brand-cell">S</span></span>
      <div class="brand-text">
        <span class="brand-name">SAS ODONTO</span>
        <span class="brand-sub">CLÍNICA ODONTOLÓGICA</span>
      </div>
    </header>

    <div class="board-body">
      <div>
        <span class="kicker">CONTROL DE ACCESO</span>
        <h1 class="title">ACCESO DEL PERSONAL</h1>
      </div>

      <form class="form" (ngSubmit)="onSubmit()" novalidate>
        <label class="field">
          <span class="field-label">USUARIO</span>
          <input
            class="field-input"
            type="text"
            name="username"
            [(ngModel)]="username"
            autocomplete="username"
            placeholder="CÓDIGO DEL PERSONAL"
          />
        </label>

        <label class="field">
          <span class="field-label">CONTRASEÑA</span>
          <input
            class="field-input"
            type="password"
            name="password"
            [(ngModel)]="password"
            autocomplete="current-password"
            placeholder="CLAVE DE ACCESO"
          />
        </label>

        <p *ngIf="error" class="error" role="alert">{{ error }}</p>

        <button class="btn-enter" type="submit" [disabled]="loading">
          <span class="lamp" aria-hidden="true"></span>
          <span>{{ loading ? 'INGRESANDO…' : 'INGRESAR' }}</span>
        </button>
      </form>

      <footer class="demo">
        <span class="demo-lamp" aria-hidden="true"></span>
        <span>ACCESO DEMO — <span class="demo-cred">mrivera / password</span></span>
      </footer>
    </div>
  </div>
</div>
