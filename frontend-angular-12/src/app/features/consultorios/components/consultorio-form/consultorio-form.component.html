<form class="form" (ngSubmit)="onSubmit()" novalidate>
  <div class="form-grid">
    <label class="field">
      <span class="field-label">SALA *</span>
      <input
        class="field-input"
        type="text"
        [(ngModel)]="name"
        name="name"
        placeholder="CONSULTORIO 07"
        autocomplete="off"
      />
    </label>

    <label class="field">
      <span class="field-label">SILLÓN / UNIDAD</span>
      <input
        class="field-input"
        type="text"
        [(ngModel)]="unit"
        name="unit"
        placeholder="SILLÓN F"
        autocomplete="off"
      />
    </label>

    <label class="field">
      <span class="field-label">ODONTÓLOGO ASIGNADO *</span>
      <input
        class="field-input"
        type="text"
        [(ngModel)]="dentist"
        name="dentist"
        placeholder="DR. RIVERA"
        autocomplete="off"
      />
    </label>

    <label class="field">
      <span class="field-label">UBICACIÓN</span>
      <input
        class="field-input"
        type="text"
        [(ngModel)]="location"
        name="location"
        placeholder="PISO 1 · ALA ESTE"
        autocomplete="off"
      />
    </label>

    <label class="field">
      <span class="field-label">ESTADO</span>
      <select class="field-select" [(ngModel)]="status" name="status" aria-label="Estado del consultorio">
        <option *ngFor="let s of statuses" [ngValue]="s">{{ s }}</option>
      </select>
    </label>

    <label class="field field--full">
      <span class="field-label">EQUIPOS E INSTRUMENTAL</span>
      <input
        class="field-input"
        type="text"
        [(ngModel)]="equipment"
        name="equipment"
        placeholder="SILLÓN · RAYOS X · LÁMPARA LED"
        autocomplete="off"
      />
    </label>
  </div>

  <p class="form-error" *ngIf="error" role="alert">SALA Y ODONTÓLOGO SON OBLIGATORIOS</p>

  <div class="form-actions">
    <button class="btn-amber" type="submit">{{ consultorio ? 'GUARDAR CAMBIOS' : 'REGISTRAR SALA' }}</button>
    <button class="btn-ghost" type="button" (click)="cancel.emit()">CANCELAR</button>
  </div>
</form>
