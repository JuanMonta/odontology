<aside class="panel" aria-label="Pacientes en espera">
  <header class="panel-head">
    <div>
      <h2 class="panel-title">EN ESPERA</h2>
      <span class="panel-sub">SALA DE ESPERA · HOY</span>
    </div>
    <span class="panel-count" [class.has-items]="waiting.length > 0">
      {{ waiting.length }}
    </span>
  </header>

  <div class="panel-list">
    <div
      *ngFor="let p of visibleWaiting; trackBy: trackById"
      class="ticket"
    >
      <span class="ticket-number">{{ p.ticket }}</span>
      <div class="ticket-body">
        <span class="ticket-name">{{ p.patient }}</span>
        <span class="ticket-meta">{{ p.reason }}</span>
      </div>
      <span class="ticket-time">{{ p.arrivedAt }}</span>
    </div>
  </div>

  <app-pagination
    *ngIf="waiting.length > pageSize"
    [total]="waiting.length"
    [page]="page"
    [pageSize]="pageSize"
    [compact]="true"
    (pageChange)="goToPage($event)"
    (pageSizeChange)="setPageSize($event)"
  ></app-pagination>

  <div class="panel-actions">
    <p class="panel-error" *ngIf="errorMessage" role="alert">{{ errorMessage }}</p>
    <button class="call-btn" (click)="callNext.emit()" [disabled]="waiting.length === 0">
      <svg class="call-btn-icon" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">
        <path d="M2 1.2a1 1 0 0 1 1.52-.86l7.3 4.8a1 1 0 0 1 0 1.72l-7.3 4.8A1 1 0 0 1 2 10.8V1.2z" fill="currentColor"/>
      </svg>
      LLAMAR SIGUIENTE
    </button>
    <button class="btn-ghost walkin-btn" type="button" (click)="openWalkIn()" aria-label="Alta walk-in">
      <svg class="btn-plus" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">
        <path d="M6 1v10M1 6h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/>
      </svg>
      ALTA WALK-IN
    </button>
  </div>
</aside>

<!-- Modal Alta Walk-In -->
<div class="picker" *ngIf="walkInOpen" role="dialog" aria-modal="true" aria-label="Alta walk-in">
  <div class="picker-backdrop" (click)="onWalkInBackdrop($event)"></div>
  <div class="picker-panel" #walkInPanel tabindex="-1" (click)="$event.stopPropagation()">
    <div class="picker-head">
      <span class="picker-title">ALTA WALK-IN</span>
      <button class="picker-close" type="button" aria-label="Cerrar" (click)="closeWalkIn()">
        <svg class="icon-x" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true">
          <path d="M3 3l10 10"></path>
          <path d="M13 3L3 13"></path>
        </svg>
      </button>
    </div>

    <div class="picker-body">
      <div class="field">
        <label class="field-label">PACIENTE</label>
        <input
          class="field-input"
          type="text"
          [(ngModel)]="walkInNombre"
          (ngModelChange)="walkInNombre = $event.toUpperCase()"
          placeholder="NOMBRE Y APELLIDO"
          autocomplete="off"
          aria-label="Nombre del paciente"
        />
      </div>
      <div class="field">
        <label class="field-label">MOTIVO</label>
        <input
          class="field-input"
          type="text"
          [(ngModel)]="walkInMotivo"
          (ngModelChange)="walkInMotivo = $event.toUpperCase()"
          placeholder="MOTIVO DE LA VISITA"
          autocomplete="off"
          aria-label="Motivo de la visita"
        />
      </div>
      <app-autocomplete
        label="TRATAMIENTO (OPCIONAL)"
        [options]="(treatmentOptions$ | async) ?? []"
        [value]="walkInTratamiento"
        (valueChange)="walkInTratamiento = $event"
        placeholder="LIMPIEZA Y PROFILAXIS"
      ></app-autocomplete>
    </div>

    <div class="picker-foot">
      <button class="picker-confirm" type="button" (click)="onWalkInSubmit()">GUARDAR</button>
      <button class="btn-ghost" type="button" (click)="closeWalkIn()">CANCELAR</button>
    </div>
  </div>
</div>
