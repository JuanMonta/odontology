<section class="board" aria-label="Agenda de citas del día">
  <header class="board-head">
    <div class="board-title">
      <h2 class="board-kicker">AGENDA DE HOY</h2>
      <span class="board-date">MARTES 04 · CONSULTORIOS</span>
    </div>
    <app-flap-clock></app-flap-clock>
  </header>

  <div class="board-columns" aria-hidden="true">
    <span class="col col-time">HORA</span>
    <span class="col col-patient">PACIENTE</span>
    <span class="col col-treatment">TRATAMIENTO</span>
    <span class="col col-chair">CONSULTORIO</span>
    <span class="col col-status">ESTADO</span>
  </div>

  <div class="board-rows" role="table" aria-label="Citas del día">
    <div
      *ngFor="let a of visibleAppointments; trackBy: trackById"
      class="row"
      [class.row--live]="a.status === 'boarding'"
      [class.row--arrived]="a.status === 'arrived'"
      [class.row--delayed]="a.status === 'delayed'"
      [class.row--no-show]="a.status === 'no-show'"
      [class.row--cancelled]="a.status === 'cancelled'"
      [class.row--done]="a.status === 'done'"
      role="row"
    >
      <div class="col col-time" role="cell">
        <app-flap-text [value]="a.time" size="sm"></app-flap-text>
      </div>
      <div class="col col-patient" role="cell">
        <span class="patient-name">{{ a.patient }}</span>
      </div>
      <div class="col col-treatment" role="cell">
        <app-flap-text [value]="a.treatment" size="sm" [painted]="true"></app-flap-text>
      </div>
      <div class="col col-chair" role="cell">
        <app-flap-text [value]="a.consultorio" size="sm" [painted]="true"></app-flap-text>
      </div>
      <div class="col col-status" role="cell">
        <span class="status" [class.status--live]="a.status === 'boarding'">
          <span class="lamp" [attr.data-status]="a.status"></span>
          <span class="status-label">{{ statusLabel(a.status) }}</span>
        </span>
        <div class="row-actions">
          <button
            *ngIf="a.status === 'on-time'"
            class="checkin-btn"
            [class.is-waiting]="isWaiting(a.patient)"
            [disabled]="isWaiting(a.patient)"
            (click)="checkIn.emit(a.id)"
            title="Marcar llegada"
          >{{ isWaiting(a.patient) ? 'EN ESPERA' : 'LLEGÓ' }}</button>
          <button
            *ngIf="a.status === 'boarding'"
            class="done-btn"
            (click)="markDone.emit(a.id)"
          >ATENDER</button>
          <button
            *ngIf="a.status === 'on-time' || a.status === 'arrived' || a.status === 'delayed'"
            class="noshow-btn"
            (click)="noShow.emit(a.id)"
            title="Registrar no asistencia"
          >NO ASISTIÓ</button>
          <button
            *ngIf="a.status === 'on-time' || a.status === 'arrived' || a.status === 'delayed'"
            class="cancel-btn"
            (click)="cancel.emit(a.id)"
            title="Cancelar cita"
          >CANCELAR</button>
        </div>
      </div>
    </div>
  </div>

  <app-pagination
    *ngIf="appointments.length > pageSize"
    [total]="appointments.length"
    [page]="page"
    [pageSize]="pageSize"
    (pageChange)="goToPage($event)"
    (pageSizeChange)="setPageSize($event)"
  ></app-pagination>
</section>
