<div class="page">
  <header class="page-head">
    <div class="page-head-row">
      <div class="page-head-actions">
        <button class="btn-amber" type="button" (click)="startCreate()">
          <span class="btn-plus" aria-hidden="true"></span>
          NUEVA CITA
        </button>
      </div>
    </div>
    <form class="new-form" *ngIf="creating" (ngSubmit)="onNewAppointment()" novalidate>
      <div class="form-grid">
        <app-time-picker
          label="HORA"
          [required]="true"
          [value]="draft.time"
          (valueChange)="onValueChange('time', $event)"
        ></app-time-picker>
        <app-autocomplete
          label="PACIENTE"
          [required]="true"
          [options]="(patientOptions$ | async) ?? []"
          [value]="draft.patient"
          (valueChange)="onValueChange('patient', $event)"
          placeholder="MARÍA QUISPE"
        ></app-autocomplete>
        <app-autocomplete
          label="TRATAMIENTO"
          [options]="(treatmentOptions$ | async) ?? []"
          [value]="draft.treatment"
          (valueChange)="onValueChange('treatment', $event)"
          placeholder="LIMPIEZA"
        ></app-autocomplete>
        <app-autocomplete
          label="CONSULTORIO"
          [options]="(consultorioOptions$ | async) ?? []"
          [value]="draft.consultorio"
          (valueChange)="onValueChange('consultorio', $event)"
          placeholder="CONSULTORIO 01"
        ></app-autocomplete>
        <app-autocomplete
          label="ODONTÓLOGO"
          [options]="(dentistOptions$ | async) ?? []"
          [value]="draft.dentist"
          (valueChange)="onValueChange('dentist', $event)"
          placeholder="DR. RIVERA"
        ></app-autocomplete>
      </div>

      <p class="form-error" *ngIf="error" role="alert">HORA Y PACIENTE SON OBLIGATORIOS</p>

      <div class="form-actions">
        <button class="btn-amber" type="submit">REGISTRAR CITA</button>
        <button class="btn-ghost" type="button" (click)="cancelCreate()">CANCELAR</button>
      </div>
    </form>
  </header>

  <div class="page-grid">
    <div class="page-main">
      <section class="overview" aria-label="Resumen del día">
        <div class="stat">
          <span class="stat-value">{{ (totals$ | async)?.total ?? 0 }}</span>
          <span class="stat-label">CITAS</span>
        </div>
        <div class="stat">
          <span class="stat-value">{{ (totals$ | async)?.waiting ?? 0 }}</span>
          <span class="stat-label">EN ESPERA</span>
        </div>
        <div class="stat">
          <span class="stat-value">{{ (totals$ | async)?.delayed ?? 0 }}</span>
          <span class="stat-label">RETRASO</span>
        </div>
        <div class="stat">
          <span class="stat-value">{{ (totals$ | async)?.done ?? 0 }}</span>
          <span class="stat-label">ATENDIDAS</span>
        </div>
      </section>

      <app-departures-board
        [appointments]="(appointments$ | async) ?? []"
        [waitingPatients]="(waitingNames$ | async) ?? []"
        (markDone)="onMarkDone($event)"
        (checkIn)="onCheckIn($event)"
      ></app-departures-board>
    </div>

    <app-waiting-panel
      [waiting]="(waiting$ | async) ?? []"
      (callNext)="onCallNext()"
      (addWalkIn)="onWalkIn($event)"
    ></app-waiting-panel>
  </div>
</div>
