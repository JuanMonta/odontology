<!--
  DIRECCION: TABLERO DE EMBARQUE — split-flap concourse applied to the dental
  agenda. THESIS: the clinic day reads as a departure board; rows are live and
  ranked by time, only the flaps move. OWN-WORLD: matte black flap faces, white
  painted letters, brushed steel chrome, amber for live, dim red for cancelled.
  STORY: staff scan time-ranked rows, spot delay/boarding instantly, call the
  next waiting patient. FIRST VIEWPORT: steel shell + black split-flap board of
  today's agenda + waiting rail. FORM: split-flap concourse board (challenger).
-->
<div class="shell">
  <aside
    id="sidebar-drawer"
    class="drawer"
    [class.is-open]="open"
    [attr.aria-hidden]="!open"
  >
    <div class="drawer-head">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <span class="brand-mark-cell">S</span>
        </span>
        <div class="brand-text">
          <span class="brand-name">SAS ODONTO</span>
          <span class="brand-sub">CLÍNICA ODONTOLÓGICA</span>
        </div>
      </div>
      <button
        class="drawer-close"
        type="button"
        aria-label="Cerrar menú"
        (click)="close()"
      >
        <svg
          class="icon-x"
          viewBox="0 0 16 16"
          fill="none"
          stroke="currentColor"
          stroke-width="1.4"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <path d="M3 3l10 10"></path>
          <path d="M13 3L3 13"></path>
        </svg>
      </button>
    </div>

    <nav class="drawer-nav" aria-label="Navegación principal">
      <ng-container *ngFor="let section of sections">
        <span class="nav-kicker">{{ section.label }}</span>
        <a
          *ngFor="let item of section.items"
          class="nav-item"
          [class.nav-item--active]="item.active"
          [routerLink]="item.route"
          (click)="onNavigate($event, item)"
        >
          <span class="nav-lamp" aria-hidden="true"></span>
          <span class="nav-label">{{ item.label }}</span>
          <span class="nav-badge" *ngIf="item.badge">{{ item.badge }}</span>
        </a>
      </ng-container>
    </nav>

    <div class="drawer-foot">
      <div class="user">
        <span class="user-avatar" aria-hidden="true">DR</span>
        <div class="user-meta">
          <span class="user-name">DR. RIVERA</span>
          <span class="user-role">ADMINISTRADOR</span>
        </div>
      </div>
      <button class="logout" type="button" (click)="onLogout()">
        <svg
          class="icon-power"
          viewBox="0 0 16 16"
          fill="none"
          stroke="currentColor"
          stroke-width="1.4"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <path d="M8 1.5V7.5"></path>
          <path d="M3.4 4.2a6 6 0 1 0 9.2 0"></path>
        </svg>
        CERRAR SESIÓN
      </button>
    </div>
  </aside>

  <div class="backdrop" [class.is-visible]="open" (click)="close()"></div>

  <div class="content">
    <header class="topbar">
      <div class="topbar-left">
        <button
          #burger
          class="burger"
          type="button"
          [attr.aria-expanded]="open"
          aria-controls="sidebar-drawer"
          aria-label="Abrir menú de navegación"
          (click)="toggle()"
        >
          <span class="burger-bar" aria-hidden="true"></span>
        </button>
        <div class="topbar-titles">
          <h1 class="topbar-title">{{ activeTitle }}</h1>
          <span class="topbar-date">{{ today }}</span>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="btn-ghost" *ngIf="activeAction" (click)="onAction()">
          <span class="btn-plus" aria-hidden="true"></span>
          {{ activeAction }}
        </button>
      </div>
    </header>

    <main class="main">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
