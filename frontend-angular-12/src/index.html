<!doctype html>
<html lang="es" data-theme="carta">

<head>
  <meta charset="utf-8">
  <title>SAS Odontología</title>
  <base href="/">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >
  <link
    rel="icon"
    type="image/x-icon"
    href="favicon.ico"
  >
  <script>
    (function () {
      var tema = 'carta';
      try {
        var guardado = localStorage.getItem('saas.clinica.tema');
        if (guardado === 'carta' || guardado === 'clinica' || guardado === 'concourse') {
          tema = guardado;
        }
      } catch (e) {
        // almacenamiento no disponible: tema por defecto
      }
      document.documentElement.setAttribute('data-theme', tema);
    })();
  </script>
</head>

<body>
  <app-root></app-root>
</body>

</html>
